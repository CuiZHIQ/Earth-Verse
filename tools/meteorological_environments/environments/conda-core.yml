  - numpy>=1.26,<3
  - scipy>=1.12,<2
  - pandas>=2.2,<3
  - xarray>=2024.1
  - dask>=2024.1
  - pint>=0.23
  - pint-xarray>=0.3
  - cf-xarray>=0.9
  - metpy>=1.6,<2
  - xclim>=0.50,<1
  - cdo>=2.4
  - nco>=5.2
  - netcdf4>=1.6
  - h5netcdf>=1.3
  - libnetcdf
  - netcdf-fortran
  - gfortran
  - openmpi
  - libblas
  - liblapack
  - r-base>=4.3,<5
  - r-spei
  - r-extremes
  - r-climdex.pcic
  - julia>=1.10,<2
